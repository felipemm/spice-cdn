# Build apps/control-plane, push to GHCR, and bump deploy/helm/control-plane/values.yaml image tag
# so Argo CD (sync from main) rolls out a new Deployment revision.

name: Control plane image

on:
  push:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: control-plane-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: apps/control-plane
  DOCKERFILE: apps/control-plane/Dockerfile

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image name (lowercase for GHCR)
        id: image
        run: |
          owner_repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_repo_lower}/control-plane" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU (cross-build arm64 on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kind on Apple Silicon = linux/arm64; GitHub-hosted runners = linux/amd64. Without both,
      # kubelet fails with: no match for platform in manifest: not found
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Bump Helm image in values.yaml
        run: |
          set -euo pipefail
          img='${{ steps.image.outputs.name }}'
          tag='${{ github.sha }}'
          perl -i -pe "s|^  repository:.*|  repository: ${img}|" deploy/helm/control-plane/values.yaml
          perl -i -pe "s|^  tag:.*|  tag: ${tag}|" deploy/helm/control-plane/values.yaml

      - name: Commit and push values bump
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/control-plane/values.yaml
          if git diff --staged --quiet; then
            echo "No Helm values change to commit."
            exit 0
          fi
          git commit -m "chore(ci): bump control-plane image to ${GITHUB_SHA}"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:refs/heads/${BRANCH}"
