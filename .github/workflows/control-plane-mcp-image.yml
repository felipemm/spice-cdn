# Build apps/control-plane-mcp (FastMCP), push to GHCR, bump deploy/helm/control-plane values for the MCP sidecar image.

name: Control plane MCP image

on:
  push:
    branches: [main]
    paths:
      - "apps/control-plane-mcp/**"
      - ".github/workflows/control-plane-mcp-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: control-plane-mcp-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: apps/control-plane-mcp
  DOCKERFILE: apps/control-plane-mcp/Dockerfile

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image name (lowercase for GHCR)
        id: image
        run: |
          owner_repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_repo_lower}/control-plane-mcp" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU (cross-build arm64 on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Bump Helm MCP image in values.yaml
        uses: mikefarah/yq@v4.45.1
        env:
          MCP_IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ github.sha }}
        with:
          cmd: >-
            yq -i '.mcp.image.repository = strenv(MCP_IMAGE) | .mcp.image.tag = strenv(TAG)'
            deploy/helm/control-plane/values.yaml

      - name: Commit and push values bump
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/control-plane/values.yaml
          if git diff --staged --quiet; then
            echo "No Helm values change to commit."
            exit 0
          fi
          git commit -m "chore(ci): bump control-plane-mcp image to ${GITHUB_SHA}"
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:refs/heads/${BRANCH}"
