# Build and deploy the marketing + Starlight docs site to GitHub Pages.
#
# Tag pushes cannot deploy to the github-pages environment if it is restricted to "main" only.
# After a release, [.github/workflows/release.yml](release.yml) dispatches this workflow on `main`
# with input `spice_release` = the tag (e.g. v0.1.1). To allow tag-triggered deploys instead, see
# [docs/github-pages-environment.md](../../docs/github-pages-environment.md).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      spice_release:
        description: "Tag to embed in public/install.sh (default = latest GitHub Release API)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install & build
        working-directory: website
        env:
          PUBLIC_ASTRO_SITE: ${{ vars.PUBLIC_ASTRO_SITE }}
          PUBLIC_ASTRO_BASE: ${{ vars.PUBLIC_ASTRO_BASE }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SPICE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.spice_release || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SPICE_RELEASE:-}" ]; then
            export PUBLIC_SPICE_PACKAGED_RELEASE="${INPUT_SPICE_RELEASE}"
          else
            export PUBLIC_SPICE_PACKAGED_RELEASE="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
                | jq -r '.tag_name // empty'
            )"
          fi
          export PUBLIC_ASTRO_SITE="${PUBLIC_ASTRO_SITE:-https://${REPO_OWNER}.github.io/${REPO_NAME}/}"
          export PUBLIC_ASTRO_BASE="${PUBLIC_ASTRO_BASE:-/${REPO_NAME}/}"
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
