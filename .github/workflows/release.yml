# On tag v*, package platform tarball for install.sh (pinned releases).
name: Release platform bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare bundle
        id: prep
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ROOT="spice-platform-${TAG}"
          mkdir -p "dist/${ROOT}/templates"
          cp -r templates/gitops "dist/${ROOT}/templates/"
          cp -r charts deploy scripts/install.sh examples hack "dist/${ROOT}/"
          [[ -d .gitea ]] && cp -r .gitea "dist/${ROOT}/" || true
          {
            echo "SPICE_PLATFORM_RELEASE=${TAG}"
            echo "SPICE_PRODUCT_REPO=${GITHUB_REPOSITORY}"
          } > "dist/${ROOT}/RELEASE_META.env"
          sed -i "s/^SPICE_PACKAGED_RELEASE=.*/SPICE_PACKAGED_RELEASE=\"${TAG}\"/" "dist/${ROOT}/install.sh"
          # Tarball at repo root (not under dist/) so sha256sum path matches.
          tar czvf "spice-platform-${TAG}.tar.gz" -C dist "${ROOT}"
          sha256sum "spice-platform-${TAG}.tar.gz" > "spice-platform-${TAG}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spice-platform-*.tar.gz
            spice-platform-*.tar.gz.sha256
          generate_release_notes: true

  # Pages cannot deploy from tag refs if the github-pages environment only allows "main".
  # Dispatch the Pages workflow on main with the release tag embedded in public/install.sh.
  dispatch-pages:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/actions/workflows/pages.yml/dispatches" \
            -d "$(jq -n --arg t "$TAG" '{ref:"main",inputs:{spice_release:$t}}')"
