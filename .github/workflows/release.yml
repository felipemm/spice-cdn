# On tag v*, package platform tarball for install.sh (pinned releases).
name: Release platform bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare bundle
        id: prep
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ROOT="spice-platform-${TAG}"
          mkdir -p "dist/${ROOT}"
          cp -r templates/gitops charts deploy scripts/install.sh examples hack "dist/${ROOT}/"
          {
            echo "SPICE_PLATFORM_RELEASE=${TAG}"
            echo "SPICE_PRODUCT_REPO=${GITHUB_REPOSITORY}"
          } > "dist/${ROOT}/RELEASE_META.env"
          sed -i "s/^SPICE_PACKAGED_RELEASE=.*/SPICE_PACKAGED_RELEASE=\"${TAG}\"/" "dist/${ROOT}/install.sh"
          (cd dist && tar czvf "../spice-platform-${TAG}.tar.gz" "${ROOT}")
          (cd dist && sha256sum "spice-platform-${TAG}.tar.gz" > "../spice-platform-${TAG}.tar.gz.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spice-platform-*.tar.gz
            spice-platform-*.tar.gz.sha256
          generate_release_notes: true
