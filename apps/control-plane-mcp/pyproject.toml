[project]
name = "control-plane-mcp"
version = "0.2.0"
description = "FastMCP Streamable HTTP bridge to the spice-k8s-cdn Next.js control plane"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=3.3.1,<4",
  "httpx>=0.27,<0.29",
]

[project.scripts]
control-plane-mcp = "spice_control_plane_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
