{{- if .Values.externalSecret.enabled }}
{{- $slug := include "spice-instance.ownerLayerSlug" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spice-instance.fullname" . }}-vault
  labels:
    app.kubernetes.io/name: {{ include "spice-instance.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    owner-layer-slug: {{ $slug | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.clusterSecretStoreName is required" .Values.externalSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ required "externalSecret.targetSecretName is required" .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
    {{- /* Explicit defaults so Server-Side Apply matches ESO / API defaulting (avoids Argo CD drift). */}}
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ required "externalSecret.vaultPath is required" .Values.externalSecret.vaultPath | quote }}
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
