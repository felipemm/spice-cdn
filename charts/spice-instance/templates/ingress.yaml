{{- if .Values.ingress.enabled }}
{{- $slug := include "spice-instance.ownerLayerSlug" . }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "spice-instance.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "spice-instance.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    owner-layer-slug: {{ $slug | quote }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "spice-instance.spiceaiServiceName" . }}
                port:
                  number: 8090
{{- end }}
