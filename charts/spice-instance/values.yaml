# Parent chart values. Subchart values live under the `spiceai:` key.
# See https://spiceai.org/docs/deployment/kubernetes for upstream keys.

# --- Wrapper: Ingress for this Spice instance ---
ingress:
  enabled: true
  className: nginx
  # Full hostname for this instance (e.g. spice-demo.127.0.0.1.nip.io)
  host: ""
  tls:
    enabled: false
    secretName: ""

# Optional: External Secrets pulls Vault KV into a Kubernetes Secret for Spice env.
externalSecret:
  enabled: false
  clusterSecretStoreName: vault-backend
  vaultPath: spice/instances/example
  targetSecretName: spice-change-me-env
  refreshInterval: 1m

# Optional: force stable Service name for Ingress backend (matches Helm subchart naming)
spiceai:
  # Example minimal spicepod — replace in per-instance values.yaml
  spicepod:
    name: app
    version: v1
    kind: Spicepod
    datasets: []
  service:
    type: ClusterIP
  resources: {}
