# Parent chart values. Subchart values live under the `spiceai:` key.
# See https://spiceai.org/docs/deployment/kubernetes for upstream keys.

# Required: cost attribution + Kyverno. Must match spiceai.additionalLabels["owner-layer-slug"].
# Override in every per-instance values.yaml (control plane template sets both fields).
ownerLayerSlug: replace-me

# --- Wrapper: Ingress for this Spice instance ---
ingress:
  enabled: true
  className: nginx
  # Full hostname for this instance (e.g. spice-demo.127.0.0.1.nip.io)
  host: ""
  # Spice HTTP API port on the workload Service. Clients use the ingress hostname on standard :80/:443; nginx forwards here.
  httpBackendPort: 8090
  metricsBackendPort: 9090
  flightSQLEndpoint: 50051
  tls:
    enabled: false
    secretName: ""

# Optional: External Secrets pulls Vault KV into a Kubernetes Secret for Spice env.
# Requires a ClusterSecretStore named clusterSecretStoreName (default vault-backend); see gitops/bootstrap/manifests/cluster-secret-store.yaml.
externalSecret:
  enabled: false
  clusterSecretStoreName: vault-backend
  vaultPath: spice/instances/example
  targetSecretName: spice-change-me-env
  refreshInterval: 1m

# Optional: force stable Service name for Ingress backend (matches Helm subchart naming)
spiceai:
  # Upstream merges this into Pod labels via spiceai.labels (keep in sync with ownerLayerSlug).
  additionalLabels:
    owner-layer-slug: replace-me
  # Example minimal spicepod — replace in per-instance values.yaml
  spicepod:
    name: app
    version: v1
    kind: Spicepod
    datasets: []
  service:
    type: ClusterIP
  resources: {}
