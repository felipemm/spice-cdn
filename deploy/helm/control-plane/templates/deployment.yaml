apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ include "control-plane.namespace" . }}
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: GITOPS_BACKEND
              value: {{ .Values.env.gitopsBackend | quote }}
            - name: GITOPS_GITEA_API_BASE_URL
              value: {{ .Values.env.gitopsGiteaApiBaseUrl | quote }}
            - name: GITOPS_REPO_OWNER
              value: {{ .Values.env.gitopsRepoOwner | quote }}
            - name: GITOPS_REPO_NAME
              value: {{ .Values.env.gitopsRepoName | quote }}
            - name: GITOPS_REPO_BRANCH
              value: {{ .Values.env.gitopsRepoBranch | quote }}
            # Backward compatibility for older chart values / local .env
            - name: GITHUB_OWNER
              value: {{ .Values.env.gitopsRepoOwner | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.env.gitopsRepoName | quote }}
            - name: GITHUB_BRANCH
              value: {{ .Values.env.gitopsRepoBranch | quote }}
            - name: VAULT_ADDR
              value: {{ .Values.env.vaultAddr | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.env.vaultRole | quote }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.env.argocdNamespace | quote }}
            - name: SPICE_NAMESPACE
              value: {{ .Values.env.spiceNamespace | quote }}
            - name: KIND_LAB_INGRESS_ROOT
              value: {{ .Values.env.kindLabIngressRoot | default "127.0.0.1.nip.io" | quote }}
            - name: KIND_LAB_INGRESS_SCHEME
              value: {{ .Values.env.kindLabIngressScheme | default "http" | quote }}
            - name: GITOPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gitopsTokenSecretName }}
                  key: {{ .Values.secrets.gitopsTokenSecretKey }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.gitopsTokenSecretName }}
                  key: {{ .Values.secrets.gitopsTokenSecretKey }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.vaultTokenSecretName }}
                  key: {{ .Values.secrets.vaultTokenSecretKey }}
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.adminApiKeySecretName }}
                  key: {{ .Values.secrets.adminApiKeySecretKey }}
            {{- if and .Values.externalSecret.enabled .Values.externalSecret.syncSuperset }}
            - name: SUPERSET_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetSecretName }}
                  key: SUPERSET_URL
            - name: SUPERSET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetSecretName }}
                  key: SUPERSET_USERNAME
            - name: SUPERSET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetSecretName }}
                  key: SUPERSET_PASSWORD
            {{- else if .Values.env.supersetUrl }}
            - name: SUPERSET_URL
              value: {{ .Values.env.supersetUrl | quote }}
            - name: SUPERSET_USERNAME
              value: {{ .Values.env.supersetUsername | quote }}
            {{- if .Values.secrets.supersetPasswordSecretName }}
            - name: SUPERSET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.supersetPasswordSecretName }}
                  key: {{ .Values.secrets.supersetPasswordSecretKey }}
            {{- end }}
            {{- end }}
            - name: BUDGETS_FILE
              value: "/config/budgets.yaml"
            {{- with .Values.cost.opencostBaseUrl }}
            - name: OPENCOST_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: AWS_COST_EXPLORER_ENABLED
              value: {{ .Values.cost.awsCostExplorerEnabled | quote }}
            - name: AWS_REGION
              value: {{ .Values.cost.awsRegion | quote }}
            - name: COST_NODE_INSTANCE_TYPE
              value: {{ .Values.cost.nodeInstanceType | quote }}
            {{- if .Values.cost.pricingJson }}
            - name: COST_PRICING_JSON
              value: {{ .Values.cost.pricingJson | toJson | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.budgets.enabled }}
          volumeMounts:
            - name: budgets
              mountPath: /config
              readOnly: true
          {{- end }}
        {{- if .Values.mcp.enabled }}
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.mcp.port | quote }}
            - name: CONTROL_PLANE_URL
              value: "http://127.0.0.1:{{ .Values.service.port }}"
            - name: FASTMCP_SHOW_BANNER
              value: "false"
            {{- if and .Values.mcp.auth.serverApiKeySecretName .Values.mcp.auth.serverApiKeySecretKey }}
            - name: MCP_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.auth.serverApiKeySecretName }}
                  key: {{ .Values.mcp.auth.serverApiKeySecretKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.budgets.enabled }}
      volumes:
        - name: budgets
          configMap:
            name: {{ .Release.Name }}-budgets
      {{- end }}
