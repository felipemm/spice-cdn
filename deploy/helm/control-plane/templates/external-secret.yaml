{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-vault
  namespace: {{ include "control-plane.namespace" . }}
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.clusterSecretStoreName is required" .Values.externalSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ required "externalSecret.targetSecretName is required" .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ required "externalSecret.vaultPath is required" .Values.externalSecret.vaultPath | quote }}
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
