apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: control-plane
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
