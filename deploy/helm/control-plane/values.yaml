replicaCount: 1
image:
  # Pushed by .github/workflows/control-plane-image.yml to GHCR; tag is bumped to the Git SHA on each publish so Argo CD rolls the Deployment.
  # Kind uses this ref too: nodes pull from ghcr.io (no kind load) when the package is public or imagePullSecrets is set.
  repository: ghcr.io/felipemm/spice-cdn/control-plane
  tag: 58fba0267e5eefdf020079b2a84cec5ba302dcbf
  pullPolicy: IfNotPresent
# When the GHCR package is private, create a docker-registry secret and reference it here, e.g. [ { name: ghcr-pull } ].
imagePullSecrets: []
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: nginx
  host: control-plane.127.0.0.1.nip.io
  annotations: {}
env:
  # Git repository where Argo syncs instance values. github → GitHub API; gitea → Kind in-cluster Gitea REST.
  gitopsBackend: github
  # When gitopsBackend is gitea, e.g. http://gitea-http.gitea.svc.cluster.local:3000/api/v1
  gitopsGiteaApiBaseUrl: ""
  gitopsRepoOwner: felipemm
  gitopsRepoName: spice-cdn
  gitopsRepoBranch: main
  # Vault address inside the cluster (Service DNS for the Helm release; not the StatefulSet pod name).
  vaultAddr: http://vault.vault.svc.cluster.local:8200
  vaultRole: control-plane
  # Argo CD namespace (for Kubernetes API reads / sync patches)
  argocdNamespace: argocd
  spiceNamespace: spice-instances
  # Kind lab defaults for the /cluster-urls page (nip.io + ingress-nginx on :80).
  kindLabIngressRoot: 127.0.0.1.nip.io
  kindLabIngressScheme: http
  # Optional: register each new Spice instance as a Superset SQL Lab database (Flight SQL / datafusion+flightsql).
  # Prefer externalSecret.syncSuperset (Vault KV spice/control-plane) over inline env + K8s Secret keys below.
  supersetUrl: ""
  supersetUsername: admin
# Sync control-plane runtime config from Vault via External Secrets (ClusterSecretStore vault-backend).
externalSecret:
  enabled: false
  clusterSecretStoreName: vault-backend
  vaultPath: spice/control-plane
  targetSecretName: control-plane-env
  refreshInterval: 1m
  # When true, mount SUPERSET_URL, SUPERSET_USERNAME, SUPERSET_PASSWORD from the ESO target Secret.
  syncSuperset: false
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
serviceAccount:
  create: true
  name: control-plane
  # EKS IRSA example (uncomment and set role ARN when using AWS Cost Explorer from the pod):
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/control-plane-cost
rbac:
  create: true
secrets:
  # Reference existing Secret keys mounted into the pod (do not commit real values).
  gitopsTokenSecretName: control-plane-secrets
  gitopsTokenSecretKey: gitops_token
  vaultTokenSecretName: control-plane-secrets
  vaultTokenSecretKey: vault_token
  adminApiKeySecretName: control-plane-secrets
  adminApiKeySecretKey: admin_api_key
  # When set (and env.supersetUrl), mount SUPERSET_PASSWORD for Superset REST login (e.g. same Secret as admin API key).
  supersetPasswordSecretName: ""
  supersetPasswordSecretKey: superset_password
# Optional: pin namespace on every manifest (must match Argo Application destination.namespace).
# Leave empty to use .Release.Namespace when the Helm engine sets it.
targetNamespace: ""
budgets:
  enabled: true
  # If non-empty, replaces budgets.default.yaml (use |- multiline string in Argo Helm values).
  definition: ""
cost:
  # Optional OpenCost base URL, e.g. http://opencost.opencost.svc.cluster.local:9003
  opencostBaseUrl: ""
  # Set "true" on EKS with IRSA (see docs/iam-control-plane-cost-explorer.json + serviceAccount.annotations).
  awsCostExplorerEnabled: "false"
  awsRegion: us-east-1
  # EC2 reference type for declared-cost estimates (see aws-pricing.ts NODE_TYPE_DEFAULTS). Ignored if cost.pricingJson is set.
  nodeInstanceType: m6i.large
  # Optional override for declare-based estimates: { "usdPerCpuCoreMonth": 35, "usdPerGiBMonth": 8.76 }
  pricingJson: null
# FastMCP Streamable HTTP sidecar — same pod as the Next.js app, calls loopback.
# Remote MCP URL (with ingress): https://<ingress.host>/mcp
# Default: enabled. Build/push image via .github/workflows/control-plane-mcp-image.yml (apps/control-plane-mcp);
# set mcp.enabled: false to disable the sidecar.
mcp:
  enabled: true
  port: 8000
  image:
    repository: ghcr.io/felipemm/spice-cdn/control-plane-mcp
    tag: c80e80430e5bba44cbf77a0bedf9eb314b6ad2a2
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  # Optional: require Authorization: Bearer <value> on /mcp (create a Secret key and reference it here).
  auth:
    serverApiKeySecretName: ""
    serverApiKeySecretKey: mcp_server_api_key
