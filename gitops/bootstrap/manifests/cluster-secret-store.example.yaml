# Example ClusterSecretStore for Vault KV v2 (External Secrets Operator).
# Requires: Vault reachable at $VAULT_ADDR, token in `vault-eso-token` Secret (see tutorial).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-eso-token
          namespace: external-secrets
          key: token
