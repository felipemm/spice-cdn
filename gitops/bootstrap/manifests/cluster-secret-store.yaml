# ClusterSecretStore for Vault KV v2 (External Secrets Operator).
# Apply after: ESO CRDs exist, KV v2 mount at path "secret", `vault-eso-token` Secret in `external-secrets` (see docs/tutorial.md).
# If STATUS=InvalidProviderConfig: kubectl describe clustersecretstore vault-backend (Events / status message).
# Instance charts reference this by name: vault-backend (see externalSecret.clusterSecretStoreName).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-eso-token
          namespace: external-secrets
          key: token
