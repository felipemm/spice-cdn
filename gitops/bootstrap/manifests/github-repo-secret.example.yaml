# Example: Argo CD repository Secret for HTTPS GitHub access.
# Create the real Secret in the `argocd` namespace (do not commit live tokens).
#
#   kubectl -n argocd create secret generic github-gitops \
#     --from-literal=type=git \
#     --from-literal=url=https://github.com/ORG/REPO.git \
#     --from-literal=password=GITHUB_PAT \
#     --from-literal=username=git
#   kubectl -n argocd label secret github-gitops argocd.argoproj.io/secret-type=repository
#
apiVersion: v1
kind: Secret
metadata:
  name: github-gitops
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/CHANGE_ME_ORG/CHANGE_ME_REPO.git
  username: git
  password: CHANGE_ME_PAT
