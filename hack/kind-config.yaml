# Kind cluster tuned for ingress-nginx + in-cluster workloads (Vault, Argo CD, control plane).
# See docs/tutorial.md for usage.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Avoid clashes with local Docker networks
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Map host 80/443 to the ingress controller inside the cluster
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
