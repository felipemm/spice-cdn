# Optional: Argo CD Application for OpenCost (Kind-friendly ingress for UI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    chart: opencost
    repoURL: https://opencost.github.io/opencost-helm-chart
    targetRevision: 1.33.1
    helm:
      releaseName: opencost
      # Keep in sync with values-kind.yaml (chart 1.33.1: prometheus internal URL + ui ingress under `opencost:`).
      values: |
        opencost:
          customPricing:
            enabled: true
            configmapName: pricing-config
            provider: AWS
            costModel:
              description: "m5.xlarge - 4 vCPU / 16 GiB - us-east-1 on-demand"
              CPU: "0.0480"
              spotCPU: "0.0144"
              RAM: "0.00600"
              spotRAM: "0.00180"
              storage: "0.04"
              zoneNetworkEgress: "0.01"
              regionNetworkEgress: "0.01"
              internetNetworkEgress: "0.12"
              defaultRegion: us-east-1
          prometheus:
            internal:
              enabled: true
              serviceName: kps-kube-prometheus-stack-prometheus
              namespaceName: monitoring
              port: 9090
          ui:
            ingress:
              enabled: true
              ingressClassName: nginx
              hosts:
                - host: opencost.127.0.0.1.nip.io
                  paths:
                    - /
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
