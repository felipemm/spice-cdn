# OpenCost on Kind + ingress-nginx: expose the UI on port 80 (no port-forward to :9090).
#
# Install / upgrade:
#   helm repo add opencost https://opencost.github.io/opencost-helm-chart && helm repo update
#   helm upgrade --install opencost opencost/opencost -n opencost --create-namespace \
#     --version 1.33.1 -f gitops/addons/opencost/values-kind.yaml
#
# Open UI: http://opencost.127.0.0.1.nip.io/
#
# In-cluster API (control plane OPENCOST_BASE_URL): http://opencost.opencost.svc.cluster.local:9003

opencost:
  customPricing:
    enabled: true
    configmapName: pricing-config
    provider: AWS
    costModel:
      description: "m5.xlarge - 4 vCPU / 16 GiB - us-east-1 on-demand"
      CPU: "0.0480"
      spotCPU: "0.0144"
      RAM: "0.00600"
      spotRAM: "0.00180"
      storage: "0.04"
      zoneNetworkEgress: "0.01"
      regionNetworkEgress: "0.01"
      internetNetworkEgress: "0.12"
      defaultRegion: us-east-1
  prometheus:
    internal:
      enabled: true
      # kube-prometheus-stack (release `kps`, namespace `monitoring`) — see ../kube-prometheus-stack/
      serviceName: kps-kube-prometheus-stack-prometheus
      namespaceName: monitoring
      port: 9090
  ui:
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - host: opencost.127.0.0.1.nip.io
          paths:
            - /
