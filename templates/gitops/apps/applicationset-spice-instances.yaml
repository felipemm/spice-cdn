apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spice-instances
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  generators:
    # Only directories that contain values.yaml (avoids apps for vault-seed-only folders).
    - git:
        repoURL: __GITOPS_REPO_HTTPS_URL__
        revision: __GITOPS_TARGET_REVISION__
        files:
          - path: instances/*/values.yaml
  template:
    metadata:
      name: "spice-{{index .path.segments 1}}"
      labels:
        spice.dataviz/instance: "{{index .path.segments 1}}"
    spec:
      project: spice-platform
      destination:
        server: https://kubernetes.default.svc
        namespace: spice-instances
      source:
        repoURL: __GITOPS_REPO_HTTPS_URL__
        targetRevision: __GITOPS_TARGET_REVISION__
        path: charts/spice-instance
        helm:
          releaseName: "{{index .path.segments 1}}"
          valueFiles:
            - "../../instances/{{index .path.segments 1}}/values.yaml"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
