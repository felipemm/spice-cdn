apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spice-instances
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: __GITOPS_REPO_HTTPS_URL__
__GITOPS_APPSET_GIT_INSECURE__
        revision: __GITOPS_TARGET_REVISION__
        directories:
          - path: instances/*
  template:
    metadata:
      name: "spice-{{.path.basename}}"
      labels:
        spice.dataviz/instance: "{{.path.basename}}"
    spec:
      project: spice-platform
      destination:
        server: https://kubernetes.default.svc
        namespace: spice-instances
      source:
        repoURL: __GITOPS_REPO_HTTPS_URL__
__GITOPS_APPSET_SRC_INSECURE__
        targetRevision: __GITOPS_TARGET_REVISION__
        path: charts/spice-instance
        helm:
          releaseName: "{{.path.basename}}"
          valueFiles:
            - "../../instances/{{.path.basename}}/values.yaml"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
