# Apply ONCE after materializing your GitOps repository from the platform release tarball.
# This "app of apps" syncs the manifests under `apps/` in the SAME GitOps repo (not this file).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: __GITOPS_REPO_HTTPS_URL__
    targetRevision: __GITOPS_TARGET_REVISION__
    path: apps
    directory:
      include: "*.yaml"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
