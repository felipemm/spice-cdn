# Argo CD Helm values (reference). Pin chart version in tutorial/Makefile when installing.
configs:
  params:
    # In labs you may temporarily enable insecure; prefer TLS + proper ingress in real envs.
    server.insecure: true
server:
  extraArgs:
    - --insecure
  ingress:
    # Same Kind + ingress-nginx pattern as the control plane (hostPort 80 → 127.0.0.1).
    enabled: true
    ingressClassName: nginx
    hostname: argocd.127.0.0.1.nip.io
    tls: false
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
controller:
  # kube-prometheus-stack (many CRDs + SSA) can spike controller memory; 512Mi OOMs mid-sync
  # and leaves Applications stuck in operationState.phase=Running ("Syncing" in the UI).
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
repoServer:
  # Helm manifest render for kube-prometheus-stack is large; keep headroom for concurrent apps.
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
